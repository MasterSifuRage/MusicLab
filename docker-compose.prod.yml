# MusicLab — production stack (VPS / self-hosted)
# Usage:
#   cp .env.prod.example .env.prod
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-musiclab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-musiclab}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-musiclab}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-musiclab}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-musiclab}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      REDIS_URL: redis://redis:6379
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost}
      UPLOAD_DIR: /app/uploads
      RENDER_DIR: /app/renders
      EMBEDDED_WORKER: "false"
    volumes:
      - uploads:/app/uploads
      - renders:/app/renders
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: sh -c "node dist/db/migrate.js && node dist/index.js"

  worker:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-musiclab}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-musiclab}
      REDIS_URL: redis://redis:6379
      UPLOAD_DIR: /app/uploads
      RENDER_DIR: /app/renders
    volumes:
      - uploads:/app/uploads
      - renders:/app/renders
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: node dist/worker/standalone.js

  frontend-init:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${PUBLIC_API_URL:-}
        VITE_USE_API: "true"
    volumes:
      - web_dist:/out
    command: ["sh", "-c", "cp -a /usr/share/nginx/html/. /out/"]
    restart: "no"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - web_dist:/usr/share/nginx/html:ro
    depends_on:
      api:
        condition: service_started
      frontend-init:
        condition: service_completed_successfully

volumes:
  pg_data:
  redis_data:
  uploads:
  renders:
  web_dist:
